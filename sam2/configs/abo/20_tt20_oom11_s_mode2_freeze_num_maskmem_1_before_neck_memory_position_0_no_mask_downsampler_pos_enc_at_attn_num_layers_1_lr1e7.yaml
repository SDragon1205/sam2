sav_dataset_train:
  # PATHS to Dataset
  img_folder: "/home/user/sdragon/ABO_dataset/ABO_train_100k/train/images1/" # PATH to MOSE JPEGImages folder
  gt_folder: "/home/user/sdragon/ABO_dataset/ABO_train_100k/train/labels1/"  # PATH to MOSE Annotations folder
  multiplier: 1
  train_batch_size: 1

sav_dataset_val:
  # PATHS to Dataset
  img_folder: "/home/user/sdragon/ABO_dataset/ABO_train_100k/val/images/" # PATH to MOSE JPEGImages folder
  gt_folder: "/home/user/sdragon/ABO_dataset/ABO_train_100k/val/labels/"  # PATH to MOSE Annotations folder
  multiplier: 1
  train_batch_size: 1

sav_dataset_test:
  # PATHS to Dataset
  img_folder: "/home/user/sdragon/ABO_dataset/ABO_v2v_dataset_70_seen_22_unseen_template_50_black/unseen/images/" # PATH to MOSE JPEGImages folder
  gt_folder: "/home/user/sdragon/ABO_dataset/ABO_v2v_dataset_70_seen_22_unseen_template_50_black/unseen/labels/"  # PATH to MOSE Annotations folder
  multiplier: 1
  train_batch_size: 1

# Video transforms
vos_train:
  train_transforms:
    - _target_: training.dataset.transforms.ComposeAPI
      transforms:
        - _target_: training.dataset.transforms.RandomHorizontalFlip_yolo
          consistent_transform: True
        # - _target_: training.dataset.transforms.RandomAffine_yolo
        #   # degrees: 25
        #   # shear: 20
        #   # image_interpolation: bilinear
        #   consistent_transform: True
        - _target_: training.dataset.transforms.RandomResizeAPI_yolo
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: True
        - _target_: training.dataset.transforms.ColorJitter_yolo
          consistent_transform: True
          brightness: 0.1
          contrast: 0.03
          saturation: 0.03
          hue: null
        - _target_: training.dataset.transforms.RandomGrayscale_yolo
          p: 0.05
          consistent_transform: True
        - _target_: training.dataset.transforms.ColorJitter_yolo
          consistent_transform: False
          brightness: 0.1
          contrast: 0.05
          saturation: 0.05
          hue: null
        - _target_: training.dataset.transforms.ToTensorAPI_yolo
        # - _target_: training.dataset.transforms.NormalizeAPI_yolo
        #   mean: [0.485, 0.456, 0.406]
        #   std: [0.229, 0.224, 0.225]

vos_val:
  train_transforms:
    - _target_: training.dataset.transforms.ComposeAPI
      transforms:
        # - _target_: training.dataset.transforms.RandomHorizontalFlip_yolo
        #   consistent_transform: True
        # - _target_: training.dataset.transforms.RandomAffine_yolo
        #   # degrees: 25
        #   # shear: 20
        #   # image_interpolation: bilinear
        #   consistent_transform: True
        - _target_: training.dataset.transforms.RandomResizeAPI_yolo
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: True
        # - _target_: training.dataset.transforms.ColorJitter_yolo
        #   consistent_transform: True
        #   brightness: 0.1
        #   contrast: 0.03
        #   saturation: 0.03
        #   hue: null
        # - _target_: training.dataset.transforms.RandomGrayscale_yolo
        #   p: 0.05
        #   consistent_transform: True
        # - _target_: training.dataset.transforms.ColorJitter_yolo
        #   consistent_transform: False
        #   brightness: 0.1
        #   contrast: 0.05
        #   saturation: 0.05
        #   hue: null
        - _target_: training.dataset.transforms.ToTensorAPI_yolo
        # - _target_: training.dataset.transforms.NormalizeAPI_yolo
        #   mean: [0.485, 0.456, 0.406]
        #   std: [0.229, 0.224, 0.225]

# vos:
#   train_transforms:
#     - _target_: training.dataset.transforms.ComposeAPI
#       transforms:
#         - _target_: training.dataset.transforms.RandomHorizontalFlip
#           consistent_transform: True
#         - _target_: training.dataset.transforms.RandomAffine
#           degrees: 25
#           shear: 20
#           image_interpolation: bilinear
#           consistent_transform: True
#         - _target_: training.dataset.transforms.RandomResizeAPI
#           sizes: ${scratch.resolution}
#           square: true
#           consistent_transform: True
#         - _target_: training.dataset.transforms.ColorJitter
#           consistent_transform: True
#           brightness: 0.1
#           contrast: 0.03
#           saturation: 0.03
#           hue: null
#         - _target_: training.dataset.transforms.RandomGrayscale
#           p: 0.05
#           consistent_transform: True
#         - _target_: training.dataset.transforms.ColorJitter
#           consistent_transform: False
#           brightness: 0.1
#           contrast: 0.05
#           saturation: 0.05
#           hue: null
#         - _target_: training.dataset.transforms.ToTensorAPI
#         - _target_: training.dataset.transforms.NormalizeAPI
#           mean: [0.485, 0.456, 0.406]
#           std: [0.229, 0.224, 0.225]

trainer:
  _target_: training.trainer_yolo.Trainer_yolo
  mode: ${scratch.mode} #val # train_only
  freeze_yolo: ${scratch.freeze_yolo}
  abo_train: ${scratch.abo_train}
  max_epochs: ${times:${scratch.num_epochs},${scratch.phases_per_epoch}}
  accelerator: cuda
  seed_value: 123

  model:
    _target_: training.model.yolom.YOLOMTrain
    # image_encoder:
    #   _target_: sam2.modeling.backbones.image_encoder.ImageEncoder
    #   scalp: 1
    #   trunk:
    #     _target_: sam2.modeling.backbones.hieradet.Hiera
    #     embed_dim: 112
    #     num_heads: 2
    #     drop_path_rate: 0.1
    #   neck:
    #     _target_: sam2.modeling.backbones.image_encoder.FpnNeck
    #     position_encoding:
    #       _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
    #       num_pos_feats: 256
    #       normalize: true
    #       scale: null
    #       temperature: 10000
    #     d_model: 256
    #     backbone_channel_list: [896, 448, 224, 112]
    #     fpn_top_down_levels: [2, 3]  # output level 0 and 1 directly use the backbone features
    #     fpn_interp_model: nearest
    yolo:
      _target_: sam2.modeling.backbones.yolo.yolo
      # model: /home/user/sdragon/sam2/checkpoints/yolov8s.pt
      cfg: /home/user/sdragon/sam2/v2vdet/v2vdet_ultralytics/cfg/models/v2v/11/yolo11s-v2v-multiscale_1_3_5.yaml
      nc: ${scratch.nc}
      position_encoding:
        _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
        num_pos_feats: 256
        normalize: true
        scale: null
        temperature: 10000
      has_output_upscaling: False
      norm_type: group
      oo: True

    memory_attention:
      _target_: sam2.modeling.memory_attention.MemoryAttention
      d_model: 256
      pos_enc_at_input: false
      layer:
        _target_: sam2.modeling.memory_attention.MemoryAttentionLayer
        activation: relu
        dim_feedforward: 2048
        dropout: 0.1
        pos_enc_at_attn: true
        self_attention:
          _target_: sam2.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [80, 80]
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
        d_model: 256
        pos_enc_at_cross_attn_keys: true
        pos_enc_at_cross_attn_queries: false
        cross_attention:
          _target_: sam2.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [80, 80]
          rope_k_repeat: True
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
          # kv_in_dim: 256
        # only_sa: True
      num_layers: 1

    memory_encoder:
        _target_: sam2.modeling.memory_encoder.MemoryEncoder
        out_dim: 256
        position_encoding:
          _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
          num_pos_feats: 256
          normalize: true
          scale: null
          temperature: 10000
        # ignore
        ########################################################
        mask_downsampler:
          _target_: sam2.modeling.memory_encoder.MaskDownSampler
          embed_dim: 256
          in_chans: 74
          has_mask_down: False
        ########################################################
        fuser:
          _target_: sam2.modeling.memory_encoder.Fuser
          layer:
            _target_: sam2.modeling.memory_encoder.CXBlock
            dim: 256
            kernel_size: 7
            padding: 3
            layer_scale_init_value: 1e-6
            use_dwconv: True  # depth-wise convs
          num_layers: 2
        in_dim: 256
        no_mask_downsampler: True
        # only_pos: True

    num_maskmem: ${scratch.num_maskmem}
    image_size: ${scratch.resolution}
    # apply scaled sigmoid on mask logits for memory encoder, and directly feed input mask as output mask
    sigmoid_scale_for_mem_enc: 20.0
    sigmoid_bias_for_mem_enc: -10.0
    use_mask_input_as_output_without_sam: false # true
    # Memory
    directly_add_no_mem_embed: true
    # no_obj_embed_spatial: true
    # use high-resolution feature map in the SAM mask decoder
    use_high_res_features_in_sam: true
    # output 3 masks on the first click on initial conditioning frames
    multimask_output_in_sam: true
    # SAM heads
    iou_prediction_use_sigmoid: True
    # cross-attend to object pointers from other frames (based on SAM output tokens) in the encoder
    # use_obj_ptrs_in_encoder: true
    add_tpos_enc_to_obj_ptrs: true
    proj_tpos_enc_in_obj_ptrs: true
    use_signed_tpos_enc_to_obj_ptrs: true
    only_obj_ptrs_in_the_past_for_eval: true
    # object occlusion prediction
    pred_obj_scores: true
    pred_obj_scores_mlp: true
    fixed_no_obj_ptr: true
    # multimask tracking settings
    multimask_output_for_tracking: true
    use_multimask_token_for_obj_ptr: true
    multimask_min_pt_num: 0
    multimask_max_pt_num: 1
    use_mlp_for_obj_ptr_proj: true
    # Compilation flag
    # compile_image_encoder: False

    ####### Training specific params #######
    # box/point input and corrections
    prob_to_use_pt_input_for_train: 0.5
    prob_to_use_pt_input_for_eval: 0.0
    prob_to_use_box_input_for_train: 0.5  # 0.5*0.5 = 0.25 prob to use box instead of points
    prob_to_use_box_input_for_eval: 0.0
    prob_to_sample_from_gt_for_train: 0.1  # with a small prob, sampling correction points from GT mask instead of prediction errors
    num_frames_to_correct_for_train: 2  # iteratively sample on random 1~2 frames (always include the first frame)
    num_frames_to_correct_for_eval: 1  # only iteratively sample on first frame
    rand_frames_to_correct_for_train: True  # random #init-cond-frame ~ 2
    add_all_frames_to_correct_as_cond: True  # when a frame receives a correction click, it becomes a conditioning frame (even if it's not initially a conditioning frame)
    # maximum 2 initial conditioning frames
    num_init_cond_frames_for_train: 2
    rand_init_cond_frames_for_train: True  # random 1~2
    num_correction_pt_per_frame: 7
    use_act_ckpt_iterative_pt_sampling: false
    

    
    num_init_cond_frames_for_eval: 1  # only mask on the first frame
    forward_backbone_per_frame_for_eval: True

    hidden_dim: 256
    detect_nc: ${scratch.nc}
    # detect_ch: ${scratch.ch}
    # detect_stride: ${scratch.stride}
    init_cond_frames_mode: ${scratch.init_cond_frames_mode}
    mask_for_mem_sigmoid: ${scratch.mask_for_mem_sigmoid}
    use_gt_in_first_frame: ${scratch.use_gt_in_first_frame}
    skip_first_frame: ${scratch.skip_first_frame}
    memory_before_neck: ${scratch.memory_before_neck}
    use_gt_in_all_frame: ${scratch.use_gt_in_all_frame}
    has_cond_frame_outputs: ${scratch.has_cond_frame_outputs}
    memory_position: ${scratch.memory_position}
    use_origin_yolo_outputs_encode: ${scratch.use_origin_yolo_outputs_encode}
    self_memory_encode: ${scratch.self_memory_encode}
    temp_pos_enc: ${scratch.temp_pos_enc}
    # select_frame: ${scratch.select_frame}
    skip_n_frame: ${scratch.skip_n_frame}
    # frame_transform_rate: ${scratch.frame_transform_rate}
    oo: True
    set_class_skip_first_frame_memory: ${scratch.set_class_skip_first_frame_memory}

  validator:
    _target_: training.validator.maP50_Validator
    save_dir: "./maP50"
    imgsz: ${scratch.resolution}
    conf: 0.001
    iou: 0.7
    max_det: 300
    agnostic: false
    names: ${scratch.names}
    

  data:
    train:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset 
      phases_per_epoch: ${scratch.phases_per_epoch} # Chunks a single epoch into smaller phases
      batch_sizes: # List of batch sizes corresponding to each dataset
      # - ${sa1b_dataset_train.train_batch_size} # Batch size of dataset 1
      - ${sav_dataset_train.train_batch_size} # Batch size of dataset 2
      datasets:
      # # SA1B as an example of an image dataset
      # - _target_: training.dataset.vos_dataset.VOSDataset_yolo
      #   training: true
      #   video_dataset:
      #     _target_: training.dataset.vos_raw_dataset.SA1BRawDataset_yolo
      #     img_folder: ${sa1b_dataset_train.img_folder}
      #     gt_folder: ${sa1b_dataset_train.gt_folder}
      #     # file_list_txt: ${path_to_train_filelist} # Optional
      #   sampler:
      #     _target_: training.dataset.vos_sampler.RandomUniformSampler_yolo
      #     num_frames: 1
      #   transforms: ${vos_train.train_transforms}
      #   multiplier: ${sa1b_dataset_train.multiplier}
      # SA-V as an example of a video dataset
      - _target_: training.dataset.vos_dataset.VOSDataset_yolo
        training: true
        video_dataset:
          _target_: training.dataset.vos_raw_dataset.ABO_Dataset_yolo
          img_folder: ${sav_dataset_train.img_folder}
          gt_folder: ${sav_dataset_train.gt_folder}
          # file_list_txt: ${path_to_train_filelist} # Optional
          # ann_every: 4
        sampler:
          _target_: training.dataset.vos_sampler.RandomUniformSampler_yolo
          num_frames: ${scratch.train_num_frames} # Number of frames per video
          reverse_time_prob: 0 # probability to reverse video
          template_0: True
        transforms: ${vos_train.train_transforms}
        multiplier: ${sav_dataset_train.multiplier}
      shuffle: True
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn:
        _target_: training.utils.data_utils.collate_fn_yolo
        _partial_: true
        dict_key: all
        is_visdrone_dataset: False

    val:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset 
      phases_per_epoch: ${scratch.phases_per_epoch} # Chunks a single epoch into smaller phases
      batch_sizes: # List of batch sizes corresponding to each dataset
      - 1 # Batch size of dataset 1
      # - ${scratch.train_batch_size} # Batch size of dataset 2
      datasets:
      # # SA1B as an example of an image dataset
      # - _target_: training.dataset.vos_dataset.VOSDataset_yolo
      #   training: False
      #   video_dataset:
      #     _target_: training.dataset.vos_raw_dataset.SA1BRawDataset_yolo
      #     img_folder: ${sa1b_dataset_val.img_folder}
      #     gt_folder: ${sa1b_dataset_val.gt_folder}
      #     # file_list_txt: ${path_to_train_filelist} # Optional
      #   sampler:
      #     _target_: training.dataset.vos_sampler.RandomUniformSampler_yolo
      #     num_frames: 1
      #     val: True
      #   transforms: ${vos_val.train_transforms}
      #   multiplier: ${sa1b_dataset_val.multiplier}

      # val
      # SA-V as an example of a video dataset
      - _target_: training.dataset.vos_dataset.VOSDataset_yolo
        training: False
        video_dataset:
          _target_: training.dataset.vos_raw_dataset.ABO_Dataset_yolo
          img_folder: ${sav_dataset_val.img_folder}
          gt_folder: ${sav_dataset_val.gt_folder}
          # file_list_txt: ${path_to_train_filelist} # Optional
          # ann_every: 4
        sampler:
          _target_: training.dataset.vos_sampler.RandomUniformSampler_yolo
          num_frames: ${scratch.val_num_frames} # Number of frames per video
          reverse_time_prob: 0 # probability to reverse video
          val: True
        transforms: ${vos_val.train_transforms}
        multiplier: ${sav_dataset_val.multiplier}

      # # test sav_dataset_test
      # - _target_: training.dataset.vos_dataset.VOSDataset_yolo
      #   training: False
      #   video_dataset:
      #     _target_: training.dataset.vos_raw_dataset.ABO_Dataset_yolo
      #     img_folder: ${sav_dataset_test.img_folder}
      #     gt_folder: ${sav_dataset_test.gt_folder}
      #     # file_list_txt: ${path_to_train_filelist} # Optional
      #     # ann_every: 4
      #   sampler:
      #     _target_: training.dataset.vos_sampler.RandomUniformSampler_yolo
      #     num_frames: ${scratch.val_num_frames} # Number of frames per video
      #     reverse_time_prob: 0 # probability to reverse video
      #     val: True
      #   transforms: ${vos_val.train_transforms}
      #   multiplier: ${sav_dataset_test.multiplier}
      shuffle: False
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn:
        _target_: training.utils.data_utils.collate_fn_yolo
        _partial_: true
        dict_key: val #all
        is_visdrone_dataset: False
    test:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset 
      phases_per_epoch: ${scratch.phases_per_epoch} # Chunks a single epoch into smaller phases
      batch_sizes: # List of batch sizes corresponding to each dataset
      - 1 # Batch size of dataset 1
      datasets:
      # test sav_dataset_test
      - _target_: training.dataset.vos_dataset.VOSDataset_yolo
        training: False
        video_dataset:
          _target_: training.dataset.vos_raw_dataset.ABO_Dataset_yolo
          img_folder: ${sav_dataset_test.img_folder}
          gt_folder: ${sav_dataset_test.gt_folder}
          # file_list_txt: ${path_to_train_filelist} # Optional
          # ann_every: 4
        sampler:
          _target_: training.dataset.vos_sampler.RandomUniformSampler_yolo
          num_frames: ${scratch.val_num_frames} # Number of frames per video
          reverse_time_prob: 0 # probability to reverse video
          val: True
        transforms: ${vos_val.train_transforms}
        multiplier: ${sav_dataset_test.multiplier}
      shuffle: False
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn:
        _target_: training.utils.data_utils.collate_fn_yolo
        _partial_: true
        dict_key: test #all
        is_visdrone_dataset: False

    distributed:
      backend: nccl
      find_unused_parameters: True
      timeout_mins: 30

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: training.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    # param_group_modifiers:
    #   - _target_: training.optimizer.layer_decay_param_modifier
    #     _partial_: True
    #     layer_decay_value: 0.9
    #     apply_to: 'image_encoder.trunk'
    #     overrides:
    #       - pattern: '*pos_embed*'
    #         value: 1.0

    options:
      lr:
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.base_lr}
            end_value: ${divide:${scratch.base_lr},10}
        # - scheduler:
        #     _target_: fvcore.common.param_scheduler.CosineParamScheduler
        #     start_value: ${scratch.vision_lr}
        #     end_value: ${divide:${scratch.vision_lr},10}
        #   param_names:
        #     - 'image_encoder.*'
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.1
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  loss:
    all:
      _target_: training.loss_fns.DetectionLoss
      nc: ${scratch.nc}  # 假设检测类别数为 80
      ch: ${scratch.ch}  # 假设有三个检测层，通道数分别为 256, 64, 32
      stride: ${scratch.stride}
      box: 7.5
      cls: 0.5
      dfl: 1.5
    val:
      _target_: training.loss_fns.DetectionLoss
      nc: ${scratch.nc}  # 假设检测类别数为 80
      ch: ${scratch.ch}  # 假设有三个检测层，通道数分别为 256, 64, 32
      stride: ${scratch.stride}
      box: 7.5
      cls: 0.5
      dfl: 1.5
    test:
      _target_: training.loss_fns.DetectionLoss
      nc: ${scratch.nc}  # 假设检测类别数为 80
      ch: ${scratch.ch}  # 假设有三个检测层，通道数分别为 256, 64, 32
      stride: ${scratch.stride}
      box: 7.5
      cls: 0.5
      dfl: 1.5


  distributed:
    backend: nccl
    find_unused_parameters: True

  logging:
    tensorboard_writer:
      _target_: training.utils.logger.make_tensorboard_logger
      log_dir:  ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10

  # initialize from a SAM 2 checkpoint
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0 # 0 only last checkpoint is saved.
    model_weight_initializer:
      _partial_: True
      _target_: training.utils.checkpoint_utils.load_state_dict_into_model
      strict: True
      ignore_unexpected_keys: null
      ignore_missing_keys: null

      state_dict:
        _target_: training.utils.checkpoint_utils.load_checkpoint_and_apply_kernels
        checkpoint_path: ./checkpoints/oom11_s_num_maskmem_1_memory_position_0_no_mask_downsampler_downsampler_attentionlayer_1.pt # "/home/user/sdragon/sam2/checkpoints/yolov8s_m.pt"
        ckpt_state_dict_keys: ['model']

launcher:
  num_nodes: 1
  gpus_per_node: 8
  experiment_log_dir: null # Path to log directory, defaults to ./sam2_logs/${config_name}

# SLURM args if running on a cluster
submitit:
  partition: null
  account: null
  qos: null
  cpus_per_task: 10
  use_cluster: false
  timeout_hour: 24
  name: null
  port_range: [10000, 65000]